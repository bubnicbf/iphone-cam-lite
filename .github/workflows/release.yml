name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the native app
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Report toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Derive version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run CameraCoreTests and AdapterFixtureTests
        run: make test-unit

      - name: Validate PrivacyInfo.xcprivacy
        run: plutil -lint Resources/PrivacyInfo.xcprivacy

      - name: Build IPhoneCamLite.app and package release artifacts
        run: ./scripts/package_app.sh "${{ steps.version.outputs.version }}"

      - name: Verify release package checksums
        run: |
          cd dist
          shasum -a 256 -c "IPhoneCamLite-${{ steps.version.outputs.version }}-SHA256SUMS.txt"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/IPhoneCamLite-${{ steps.version.outputs.version }}.zip" \
            "dist/IPhoneCamLite-${{ steps.version.outputs.version }}-SHA256SUMS.txt" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "See CHANGELOG.md for details. IPhoneCamLite.app is unsigned and not notarized -- see README.md for how to open it on first launch." \
            --repo "${{ github.repository }}"
